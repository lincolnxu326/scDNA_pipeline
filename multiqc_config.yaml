# MultiQC Configuration for Single-Cell DNA Pipeline
# This file configures how MultiQC processes and displays QC metrics

title: "Single-Cell DNA Sequencing QC Report"
subtitle: "Comprehensive quality metrics for scDNA-seq analysis"
intro_text: |
  This report summarizes quality control metrics for the single-cell DNA sequencing pipeline.
  The analysis includes demultiplexing, deduplication, adapter filtering, and alignment statistics.

report_comment: |
  Generated using the scDNA sequencing pipeline. For issues, check the log files.

sp:
  fastqc:
    fn: "*_fastqc.zip"
  samtools/stats:
    fn: "*.stats.txt"
    contents: "SN	raw total sequences:"
  samtools/flagstat:
    fn: "*.flagstat.txt"
    contents: "in total (QC-passed reads + QC-failed reads)"
  bowtie2:
    fn: "*.log"
    contents: "reads; of these:"
  custom_data:
    demux:
      fn: "demux_stats.json"
    dedup:
      fn: "dedup_summary.tsv"
    adapter:
      fn: "adapter_filter_summary.tsv"

custom_data:
  demux_stats:
    id: 'demux_stats'
    section_name: 'Demultiplexing Statistics'
    description: 'Read distribution across wells after demultiplexing'
    plot_type: 'bargraph'
    pconfig:
      title: 'Demultiplexed Reads per Well'
      ylab: 'Number of Reads'

  dedup_stats:
    id: 'dedup_stats'
    section_name: 'Deduplication Statistics'
    description: 'PCR duplicate removal statistics'
    plot_type: 'table'
    headers:
      dedup_rate:
        title: 'Duplication Rate'
        description: 'Percentage of duplicate reads'
        format: '{:,.1f}%'
        scale: 'RdYlGn-rev'
        max: 100
        min: 0
      unique_reads:
        title: 'Unique Reads'
        description: 'Number of unique reads after deduplication'
        format: '{:,.0f}'

  adapter_stats:
    id: 'adapter_stats'
    section_name: 'Adapter Filtering'
    description: 'Adapter dimer contamination statistics'
    plot_type: 'bargraph'
    pconfig:
      title: 'Adapter Contamination Rate'
      ylab: 'Percentage'
      max: 100
      min: 0
      colors:
        kept: '#5cb85c'
        removed: '#d9534f'

module_order:
  - fastqc
  - samtools
  - bowtie2
  - custom_data

fn_ignore_files:
  - "*.bam"
  - "*.bai"
  - "*unassigned*"

fn_ignore_dirs:
  - "*/aneufinder/*"
  - "*/logs/*"
  - "*/benchmarks/*"

table_sample_merge:
  R1:
    - type: regex
      pattern: '_R1$'
  R2:
    - type: regex
      pattern: '_R2$'

extra_fn_clean_exts:
  - type: remove
    pattern: '.filtered'
    module: fastqc
  - type: remove
    pattern: '_fastqc'
    module: fastqc
  - type: regex_keep
    pattern: 'W\d+'
    module: bowtie2

general_stats_columns:
  samtools/flagstat:
    mapped_passed:
      title: 'Mapped Reads'
      hidden: false
    mapped_passed_pct:
      title: 'Mapped %'
      hidden: false
    total_passed:
      title: 'Total Reads'
      hidden: false
    properly_paired_passed:
      title: 'Properly Paired'
      hidden: false
  samtools/stats:
    raw_total_sequences:
      title: 'Raw Total Sequences'
      hidden: false
    reads_mapped:
      title: 'Reads Mapped'
      hidden: false
  bowtie2:
    overall_alignment_rate:
      title: 'Alignment Rate'
      hidden: false

report_section_order:
  demux_stats:
    order: 100
  dedup_stats:
    order: 200
  adapter_stats:
    order: 300
  fastqc:
    order: 400
  samtools:
    order: 500
  bowtie2:
    order: 600

table_cond_formatting_rules:
  high_duplication:
    description: 'Highlight high duplication rates'
    col: 'dedup_rate'
    min: 50
    max: 100
    scale: 'RdYlGn-rev'

  low_mapping:
    description: 'Highlight low mapping rates'
    col: 'overall_alignment_rate'
    min: 0
    max: 70
    scale: 'RdYlGn'

  high_adapter:
    description: 'Highlight high adapter contamination'
    col: 'adapter_rate'
    min: 10
    max: 100
    scale: 'RdYlGn-rev'

export_plots: true
plots_force_flat: false
plots_force_interactive: false
data_dir_name: 'multiqc_data'

decimalPoint_format: ','
thousandsSep_format: ' '

report_header_info:
  - Pipeline: 'scDNA-seq Analysis'
  - Version: '2.0'
  - Contact: 'Single-Cell Genomics Core'
  - Reference: 'GRCh38'

max_table_rows: 500
log_filesize_limit: 10000000
